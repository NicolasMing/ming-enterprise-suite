name: yudao-ui-admin-vue3 CI

# 在master分支发生push事件时触发。
on:
  push:
    branches: [ master, master-jdk17, master-jdk25 ]
  # pull_request:
  #   branches: [ master ]
env: # 设置环境变量
  TZ: Asia/Shanghai # 时区（设置时区可使页面中的`最近更新时间`使用时区时间）
  WORK_DIR: yudao-ui-admin #工作目录

defaults:
  run:
    shell: bash
    working-directory: yudao-ui-admin

jobs:
  build: # 自定义名称
    runs-on: ubuntu-latest # 运行在虚拟机环境ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: NicolasMing/yudao-ui-admin-vue3
          path: yudao-ui-admin

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: yudao-ui-admin/pnpm-lock.yaml

      - name: Install deps
        run: node --version && pnpm --version && pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:prod
  
      # 查看 workflow 的文档来获取更多信息
      # @see https://github.com/crazy-max/ghaction-github-pages
